name: Inspect WorldBox bundle
on:
  push:
    branches: [arena/abffe0a5-morphe-patches-template]
    paths:
      - .github/workflows/inspect-worldbox.yml
      - .github/scripts/inspect_worldbox.py
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '7.0.x'
      - run: python -m pip install requests
      - run: python .github/scripts/inspect_worldbox.py
  runtime-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probe original WorldBox on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: WORLDBOX_RUNTIME_PROBE=1 python .github/scripts/inspect_worldbox.py

name: Inspect WorldBox bundle
on:
  push:
    branches: [arena/abffe0a5-morphe-patches-template]
    paths:
      - .github/workflows/inspect-worldbox.yml
      - .github/scripts/inspect_worldbox.py
      - .github/scripts/worldbox_runtime_scan.py
      - .github/scripts/worldbox_native_scan.py
      - .github/scripts/worldbox_native_flow.py
      - .github/scripts/worldbox_native_xrefs.py
      - .github/scripts/worldbox_thunk_callers.py
      - .github/scripts/worldbox_metadata_path_probe.py
      - .github/scripts/worldbox_metadata_java_probe.py
      - .github/scripts/worldbox_metadata_slot_probe.py
      - .github/scripts/worldbox_adjacent_thunks.py
      - .github/scripts/worldbox_bounded_reference_report.py
      - .github/scripts/worldbox_static_literal_probe.py
      - .github/scripts/worldbox_indirect_slot_probe.py
      - .github/scripts/worldbox_ghidra_probe.py
      - .github/scripts/worldbox_ghidra_callees.py
      - .github/scripts/worldbox_metadata_magic_probe.py
      - .github/scripts/worldbox_ghidra_armv7.py
      - .github/scripts/worldbox_cpp2il_probe.py
      - .github/scripts/worldbox_mfuscator_probe.py
      - .github/scripts/worldbox_il2cpp_dumper_probe.py
      - .github/scripts/worldbox_inspector_redux_probe.py
      - .github/scripts/worldbox_memory_metadata_extractor_probe.py
      - .github/scripts/worldbox_upstream.py
      - .github/scripts/worldbox_string_leads.py
      - .github/scripts/worldbox_metadata_string_counts.py
      - .github/scripts/worldbox_raw_leads.py
      - .github/scripts/worldbox_raw_context.py
      - .github/scripts/worldbox_asset_leads.py
      - .github/scripts/worldbox_unity_object_leads.py
      - .github/scripts/worldbox_unity_scripts.py
      - .github/scripts/worldbox_unity_script_refs.py
      - .github/scripts/worldbox_bundle_inventory.py
      - .github/scripts/worldbox_guid_script_refs.py
      - .github/scripts/worldbox_unity_schema.py
      - docs/worldbox/WorldboxProbe.java
      - docs/worldbox/WorldboxArmv7JniProbe.java
      - tests/fixtures/worldbox_ghidra_fixture.c
      - tests/fixtures/worldbox_ghidra_armv7_fixture.c
      - tests/test_worldbox_ghidra.py
      - tests/test_worldbox_metadata_magic_probe.py
      - tests/test_worldbox_cpp2il_probe.py
      - tests/test_worldbox_mfuscator_probe.py
      - tests/test_worldbox_il2cpp_dumper_probe.py
      - tests/test_worldbox_memory_metadata_extractor_probe.py
      - tests/test_worldbox_upstream.py
      - tests/test_worldbox_string_leads.py
      - tests/test_worldbox_metadata_string_counts.py
      - tests/test_worldbox_raw_leads.py
      - tests/test_worldbox_raw_context.py
      - tests/test_worldbox_asset_leads.py
      - tests/test_worldbox_unity_object_leads.py
      - tests/test_worldbox_unity_scripts.py
      - tests/test_worldbox_unity_script_refs.py
      - tests/test_worldbox_bundle_inventory.py
      - tests/test_worldbox_guid_script_refs.py
      - tests/test_worldbox_unity_schema.py
      - tests/test_worldbox_native.py
      - tests/test_worldbox_native_flow.py
      - tests/test_worldbox_native_xrefs.py
      - tests/test_worldbox_thunk_callers.py
      - tests/test_worldbox_metadata_path_probe.py
      - tests/test_worldbox_metadata_java_probe.py
      - tests/test_worldbox_metadata_slot_probe.py
      - tests/test_worldbox_adjacent_thunks.py
      - tests/test_worldbox_bounded_reference_report.py
      - tests/test_worldbox_static_literal_probe.py
      - tests/test_worldbox_indirect_slot_probe.py
      - docs/worldbox/scan-metadata.js
      - tests/worldbox-metadata-scanner.test.cjs
      - tests/test_worldbox_triage.py
      - docs/worldbox/proc_scan.c
      - tests/test_worldbox_proc_scan.py
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Test synthetic metadata and triage fixtures
        run: |
          node tests/worldbox-metadata-scanner.test.cjs
          python3 tests/test_worldbox_triage.py
          python3 tests/test_worldbox_proc_scan.py
          python3 tests/test_worldbox_cpp2il_probe.py
          python3 tests/test_worldbox_mfuscator_probe.py
          python3 tests/test_worldbox_il2cpp_dumper_probe.py
          python3 tests/test_worldbox_inspector_redux_probe.py
          python3 tests/test_worldbox_memory_metadata_extractor_probe.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '7.0.x'
      - run: python -m pip install requests
      - uses: actions/setup-dotnet@v5
        if: ${{ contains(github.event.head_commit.message, '[worldbox-cpp2il]') }}
        with:
          dotnet-version: '6.0.x'
      - uses: actions/setup-dotnet@v5
        if: ${{ contains(github.event.head_commit.message, '[worldbox-mfus]') }}
        with:
          dotnet-version: '10.0.302'
      - name: Build pinned BetterCpp2IL and MFuscator plugin
        if: ${{ contains(github.event.head_commit.message, '[worldbox-mfus]') }}
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/smartfish67png/BetterCpp2IL.git "$RUNNER_TEMP/BetterCpp2IL"
          git -C "$RUNNER_TEMP/BetterCpp2IL" checkout --detach 43850f644a1584a8ca700cab2f71f4b2462eb255
          cd "$RUNNER_TEMP/BetterCpp2IL"
          dotnet publish src/Cpp2IL/Cpp2IL.csproj --configuration Release --framework net10.0 --output "$RUNNER_TEMP/bettercpp2il" -p:PublishSingleFile=false -p:PublishTrimmed=false
          dotnet build src/Cpp2IL.Plugin.Mfuscator/Cpp2IL.Plugin.Mfuscator.csproj --configuration Release --framework net10.0
          mkdir -p "$RUNNER_TEMP/mfuscator-work/Plugins"
          cp src/Cpp2IL.Plugin.Mfuscator/bin/Release/net10.0/Cpp2IL.Plugin.Mfuscator.dll "$RUNNER_TEMP/mfuscator-work/Plugins/"
          test -f "$RUNNER_TEMP/bettercpp2il/Cpp2IL.dll"
          echo "BETTER_CPP2IL_DLL=$RUNNER_TEMP/bettercpp2il/Cpp2IL.dll" >> "$GITHUB_ENV"
          echo "BETTER_CPP2IL_WORK_DIR=$RUNNER_TEMP/mfuscator-work" >> "$GITHUB_ENV"
      - name: Download Cpp2IL 2022.0.7
        if: ${{ contains(github.event.head_commit.message, '[worldbox-cpp2il]') }}
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/Cpp2IL" https://github.com/SamboyCoding/Cpp2IL/releases/download/2022.0.7/Cpp2IL-2022.0.7-Linux
          chmod +x "$RUNNER_TEMP/Cpp2IL"
          "$RUNNER_TEMP/Cpp2IL" --help > "$RUNNER_TEMP/cpp2il-help.txt"
      - uses: actions/setup-dotnet@v5
        if: ${{ contains(github.event.head_commit.message, '[worldbox-redux]') }}
        with:
          dotnet-version: '10.0.302'
      - name: Download pinned Il2CppInspectorRedux Legacy CLI 2026.2
        if: ${{ contains(github.event.head_commit.message, '[worldbox-redux]') }}
        run: |
          archive="$RUNNER_TEMP/Il2CppInspectorRedux.Legacy.CLI-linux-x64.zip"
          curl -fsSL --retry 3 -o "$archive" https://github.com/LukeFZ/Il2CppInspectorRedux/releases/download/2026.2/Il2CppInspectorRedux.Legacy.CLI-linux-x64.zip
          echo "3424bce647e3fcec72ebb4b3f2e5d2405501b64068cc3afb2244ae5fbc8c45e6  $archive" | sha256sum -c -
          echo "Verified Il2CppInspectorRedux 2026.2 Legacy CLI archive"
          mkdir -p "$RUNNER_TEMP/inspector-redux"
          unzip -q "$archive" -d "$RUNNER_TEMP/inspector-redux"
          binary="$(find "$RUNNER_TEMP/inspector-redux" -type f -name 'Il2CppInspector' -print -quit)"
          if [ -z "$binary" ]; then
            find "$RUNNER_TEMP/inspector-redux" -maxdepth 3 -type f -print
            exit 1
          fi
          chmod +x "$binary"
          "$binary" --version
          echo "IL2CPP_INSPECTOR_REDUX_BIN=$binary" >> "$GITHUB_ENV"
          echo "IL2CPP_INSPECTOR_REDUX_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Download pinned MyDearMoon Il2CppDumper v1.4.0
        if: ${{ contains(github.event.head_commit.message, '[worldbox-mydm]') }}
        run: |
          archive="$RUNNER_TEMP/Il2CppDumper-linux-x64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" https://github.com/MyDearMoon/il2cpp-Dumper/releases/download/v1.4.0/Il2CppDumper-linux-x64.tar.gz
          echo "66ace171cc9acd550f95ec4c42805c419492033ed44186e7e5921c9dc23abfec  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/mydearmoon-il2cppdumper"
          tar -xzf "$archive" -C "$RUNNER_TEMP/mydearmoon-il2cppdumper"
          chmod +x "$RUNNER_TEMP/mydearmoon-il2cppdumper/Il2CppDumper"
          test -x "$RUNNER_TEMP/mydearmoon-il2cppdumper/Il2CppDumper"
          echo "MYDEARMOON_IL2CPP_DUMPER_BIN=$RUNNER_TEMP/mydearmoon-il2cppdumper/Il2CppDumper" >> "$GITHUB_ENV"
          echo "MYDEARMOON_IL2CPP_DUMPER_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Inspect WorldBox APKM
        env:
          WORLDBOX_CPP2IL_PROBE: ${{ contains(github.event.head_commit.message, '[worldbox-cpp2il]') && '1' || '0' }}
          WORLDBOX_MFUSCATOR_PROBE: ${{ contains(github.event.head_commit.message, '[worldbox-mfus]') && '1' || '0' }}
          WORLDBOX_IL2CPP_DUMPER_PROBE: ${{ contains(github.event.head_commit.message, '[worldbox-mydm]') && '1' || '0' }}
          WORLDBOX_INSPECTOR_REDUX_PROBE: ${{ contains(github.event.head_commit.message, '[worldbox-redux]') && '1' || '0' }}
          CPP2IL_BIN: ${{ runner.temp }}/Cpp2IL
          BETTER_CPP2IL_DLL: ${{ runner.temp }}/bettercpp2il/Cpp2IL.dll
          MYDEARMOON_IL2CPP_DUMPER_BIN: ${{ runner.temp }}/mydearmoon-il2cppdumper/Il2CppDumper
          MYDEARMOON_IL2CPP_DUMPER_ARCHIVE: ${{ runner.temp }}/Il2CppDumper-linux-x64.tar.gz
        run: python .github/scripts/inspect_worldbox.py
  # Requires a successful synthetic ARM64 decompilation before processing the game.
  ghidra-arm64-probe:
    if: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JAVA_TOOL_OPTIONS: -Xmx4g
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned tooling and synthetic tests
        run: |
          python -m pip install requests 'pyelftools==0.32' 'capstone==5.0.6'
          python tests/test_worldbox_ghidra.py
          python tests/test_worldbox_metadata_magic_probe.py
          python tests/test_worldbox_thunk_callers.py
          python tests/test_worldbox_bounded_reference_report.py
          python tests/test_worldbox_static_literal_probe.py
          python tests/test_worldbox_indirect_slot_probe.py
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ghidra.zip" https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.4.3_build/ghidra_11.4.3_PUBLIC_20251203.zip
          echo "b22a8baebb14339f19903c54363ba7e01781930cc43ab430539aabce0d58547a  $RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          echo "GHIDRA_HEADLESS=$RUNNER_TEMP/ghidra/ghidra_11.4.3_PUBLIC/support/analyzeHeadless" >> "$GITHUB_ENV"
      - name: Verify decompiler using a synthetic ARM64 fixture
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          fi
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" -O0 -fPIC -fno-inline -fno-optimize-sibling-calls -fno-omit-frame-pointer -funwind-tables -nostdlib -shared -Wl,-Bsymbolic tests/fixtures/worldbox_ghidra_fixture.c -o "$RUNNER_TEMP/worldbox-fixture.so"
          WORLDBOX_TEST_FIXTURE="$RUNNER_TEMP/worldbox-fixture.so" python tests/test_worldbox_ghidra.py
          python .github/scripts/worldbox_ghidra_probe.py --headless "$GHIDRA_HEADLESS" --binary "$RUNNER_TEMP/worldbox-fixture.so" --fixture
      - name: Verify ARMv7 JNI call probe on a synthetic fixture
        if: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-armv7') }}
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          fi
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang" -marm -O0 -fPIC -fno-inline -fno-optimize-sibling-calls -fno-omit-frame-pointer -funwind-tables -nostdlib -shared -Wl,-Bsymbolic tests/fixtures/worldbox_ghidra_armv7_fixture.c -o "$RUNNER_TEMP/worldbox-armv7-fixture.so"
          python .github/scripts/worldbox_ghidra_armv7.py --headless "$GHIDRA_HEADLESS" --binary "$RUNNER_TEMP/worldbox-armv7-fixture.so" --fixture
      - name: Verify second-argument provenance on the synthetic ARM64 fixture
        if: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-source') }}
        run: python .github/scripts/worldbox_ghidra_probe.py --headless "$GHIDRA_HEADLESS" --binary "$RUNNER_TEMP/worldbox-fixture.so" --fixture --input-source
      - name: Verify input memory-chain provenance on the synthetic ARM64 fixture
        if: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-chain') }}
        run: python .github/scripts/worldbox_ghidra_probe.py --headless "$GHIDRA_HEADLESS" --binary "$RUNNER_TEMP/worldbox-fixture.so" --fixture --input-chain
      - name: Verify callee decompilation on the synthetic ARM64 fixture
        if: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-callee') || contains(github.event.head_commit.message, 'worldbox-ghidra-origin') || contains(github.event.head_commit.message, 'worldbox-ghidra-tail') || contains(github.event.head_commit.message, 'worldbox-ghidra-return') || contains(github.event.head_commit.message, 'worldbox-ghidra-input') || contains(github.event.head_commit.message, 'worldbox-ghidra-children') || contains(github.event.head_commit.message, 'worldbox-ghidra-unity') || contains(github.event.head_commit.message, 'worldbox-ghidra-metadata') || contains(github.event.head_commit.message, 'worldbox-ghidra-io') || contains(github.event.head_commit.message, 'worldbox-ghidra-helper') }}
        run: python .github/scripts/worldbox_ghidra_callees.py --headless "$GHIDRA_HEADLESS" --binary "$RUNNER_TEMP/worldbox-fixture.so" --fixture
      - name: Verify generic printable-string categorization on synthetic ARM64 fixture
        if: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-io') }}
        run: |
          FIXTURE="$RUNNER_TEMP/worldbox-fixture.so"
          ADDRESS="$(PYTHONPATH=.github/scripts python -c 'import sys; from elftools.elf.elffile import ELFFile; elf=ELFFile(open(sys.argv[1], "rb")); sym=next(s for s in elf.get_section_by_name(".dynsym").iter_symbols() if s.name == "fixture_generic_string_caller"); print(hex(sym["st_value"]))' "$FIXTURE")"
          TARGET="$(PYTHONPATH=.github/scripts python -c 'import sys; from elftools.elf.elffile import ELFFile; elf=ELFFile(open(sys.argv[1], "rb")); sym=next(s for s in elf.get_section_by_name(".dynsym").iter_symbols() if s.name == "fixture_helper"); print(hex(sym["st_value"]))' "$FIXTURE")"
          python .github/scripts/worldbox_ghidra_callees.py --headless "$GHIDRA_HEADLESS" --binary "$FIXTURE" --fixture --address "$ADDRESS" --trace-target "$TARGET" --expect-string-category printable-ascii-string
      - name: Verify address-selected FDE and string-use tracing on synthetic ARM64 fixture
        if: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-unity') }}
        run: |
          FIXTURE="$RUNNER_TEMP/worldbox-fixture.so"
          ADDRESS="$(PYTHONPATH=.github/scripts python -c 'import sys; from elftools.elf.elffile import ELFFile; elf=ELFFile(open(sys.argv[1], "rb")); sym=next(s for s in elf.get_section_by_name(".dynsym").iter_symbols() if s.name == "fixture_string_caller"); print(hex(sym["st_value"]))' "$FIXTURE")"
          TARGET="$(PYTHONPATH=.github/scripts python -c 'import sys; from elftools.elf.elffile import ELFFile; elf=ELFFile(open(sys.argv[1], "rb")); sym=next(s for s in elf.get_section_by_name(".dynsym").iter_symbols() if s.name == "fixture_helper"); print(hex(sym["st_value"]))' "$FIXTURE")"
          python .github/scripts/worldbox_ghidra_callees.py --headless "$GHIDRA_HEADLESS" --binary "$FIXTURE" --fixture --address "$ADDRESS" --trace-target "$TARGET" --expect-string-category unity-purchasing-class
      - name: Verify JNI export selection on synthetic ARM64 fixture
        if: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-jni') }}
        run: python .github/scripts/worldbox_ghidra_callees.py --headless "$GHIDRA_HEADLESS" --binary "$RUNNER_TEMP/worldbox-fixture.so" --fixture --jni
      - name: Decompile bounded original ARM64 caller functions
        env:
          WORLDBOX_GHIDRA_JNI_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-jni') && '1' || '0' }}
          WORLDBOX_GHIDRA_UNITY_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-unity') && '1' || '0' }}
          WORLDBOX_GHIDRA_CALLEE_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-callee') && '1' || '0' }}
          WORLDBOX_GHIDRA_ORIGIN_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-origin') && '1' || '0' }}
          WORLDBOX_GHIDRA_TAIL_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-tail') && '1' || '0' }}
          WORLDBOX_GHIDRA_RETURN_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-return') && '1' || '0' }}
          WORLDBOX_GHIDRA_INPUT_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-input') && '1' || '0' }}
          WORLDBOX_GHIDRA_CHILDREN_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-children') && '1' || '0' }}
          WORLDBOX_GHIDRA_SOURCE_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-source') && '1' || '0' }}
          WORLDBOX_GHIDRA_CHAIN_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-chain') && '1' || '0' }}
          WORLDBOX_GHIDRA_METADATA_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-metadata') && '1' || '0' }}
          WORLDBOX_GHIDRA_IO_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-io') && '1' || '0' }}
          WORLDBOX_GHIDRA_HELPER_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-helper') && '1' || '0' }}
          WORLDBOX_THUNK_CALLERS_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-thunk') && '1' || '0' }}
          WORLDBOX_GHIDRA_SLOT_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-slots') && '1' || '0' }}
          WORLDBOX_GHIDRA_ADJACENT_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-adjacent') && '1' || '0' }}
          WORLDBOX_GHIDRA_DESTINATION_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-destinations') && '1' || '0' }}
          WORLDBOX_GHIDRA_FILE_ADAPTER_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-file-adapter') && '1' || '0' }}
          WORLDBOX_GHIDRA_FILE_HELPER_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-file-helper') && '1' || '0' }}
          WORLDBOX_GHIDRA_INDIRECT_SLOT_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-indirect-slots') && '1' || '0' }}
          WORLDBOX_GHIDRA_ARMV7_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-armv7') && '1' || '0' }}
          WORLDBOX_GHIDRA_PROBE: ${{ (contains(github.event.head_commit.message, 'worldbox-ghidra-armv7') || contains(github.event.head_commit.message, 'worldbox-ghidra-metadata') || contains(github.event.head_commit.message, 'worldbox-ghidra-io') || contains(github.event.head_commit.message, 'worldbox-ghidra-helper') || contains(github.event.head_commit.message, 'worldbox-ghidra-thunk') || contains(github.event.head_commit.message, 'worldbox-ghidra-slots') || contains(github.event.head_commit.message, 'worldbox-ghidra-adjacent') || contains(github.event.head_commit.message, 'worldbox-ghidra-destinations') || contains(github.event.head_commit.message, 'worldbox-ghidra-file-adapter') || contains(github.event.head_commit.message, 'worldbox-ghidra-file-helper') || contains(github.event.head_commit.message, 'worldbox-ghidra-indirect-slots')) && '0' || '1' }}
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python .github/scripts/inspect_worldbox.py | tee "$RUNNER_TEMP/worldbox-ghidra-output.txt"
      - name: Surface bounded follow-up annotations
        if: ${{ contains(github.event.head_commit.message, '[worldbox-open-sequence]') || contains(github.event.head_commit.message, '[worldbox-adapter-callers]') || contains(github.event.head_commit.message, '[worldbox-ghidra-thunk]') }}
        run: |
          output="$RUNNER_TEMP/worldbox-ghidra-output.txt"
          test -s "$output"
          if ! grep -qE '::(warning|notice) title=WorldBox (file-helper open sequence|adapter tail caller|thunk)' "$output"; then
            echo 'No bounded follow-up annotations were produced' >&2
            exit 1
          fi
          grep -E '::(warning|notice) title=WorldBox (file-helper open sequence|adapter tail caller|thunk)' "$output" || true
      - name: Surface slot-consumer Ghidra annotations
        if: ${{ contains(github.event.head_commit.message, '[worldbox-ghidra-slots]') }}
        run: |
          output="$RUNNER_TEMP/worldbox-ghidra-output.txt"
          test -s "$output"
          if ! grep -qE '::(warning|notice) title=WorldBox slot consumer' "$output"; then
            echo 'No slot-consumer Ghidra annotations were produced' >&2
            exit 1
          fi
          grep -E '::(warning|notice) title=WorldBox slot consumer' "$output" || true
      - name: Surface adjacent-thunk Ghidra annotations
        if: ${{ contains(github.event.head_commit.message, '[worldbox-ghidra-adjacent]') }}
        run: |
          output="$RUNNER_TEMP/worldbox-ghidra-output.txt"
          test -s "$output"

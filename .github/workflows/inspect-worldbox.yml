  runtime-probe:
    if: ${{ vars.WORLDBOX_RUNTIME_PROBE == '1' || contains(github.event.head_commit.message, '[worldbox-runtime]') || contains(github.event.head_commit.message, '[worldbox-memory-extractor]') || contains(github.event.head_commit.message, '[worldbox-memory-extractor-arm64]') || contains(github.event.head_commit.message, '[worldbox-memory-extractor-running]') || contains(github.event.head_commit.message, '[worldbox-proc-only]') || contains(github.event.head_commit.message, '[worldbox-proc-all]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Install runtime scanner dependencies
        env:
          FRIDA_ANDROID_ARCH: ${{ contains(github.event.head_commit.message, '[worldbox-memory-extractor-arm64]') && 'arm64' || 'x86_64' }}
          FRIDA_SERVER_XZ_SHA256: ${{ contains(github.event.head_commit.message, '[worldbox-memory-extractor-arm64]') && 'd91f2f79231eef2f6e8189a1e99f074fab93f538fc9347e22e4ca39d1d475202' || '6ee3d9c23149d23df0fda27663dbb6ef9ad1aa2f6166dc5e6dbcab455bd83719' }}
          WORLDBOX_PROC_ONLY: ${{ (contains(github.event.head_commit.message, '[worldbox-proc-only]') || contains(github.event.head_commit.message, '[worldbox-proc-all]')) && '1' || '0' }}
        run: |
          if [ "$WORLDBOX_PROC_ONLY" != '1' ]; then
            python -m pip install 'frida==17.25.0'
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/frida-server.xz" "https://github.com/frida/frida/releases/download/17.25.0/frida-server-17.25.0-android-${FRIDA_ANDROID_ARCH}.xz"
            echo "$FRIDA_SERVER_XZ_SHA256  $RUNNER_TEMP/frida-server.xz" | sha256sum -c -
            xz -d "$RUNNER_TEMP/frida-server.xz"
          fi
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          fi
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang" -std=c11 -Wall -Wextra -Werror -O2 docs/worldbox/proc_scan.c -o "$RUNNER_TEMP/worldbox-proc-scan"
      - name: Download pinned Frida metadata extractor
        if: ${{ contains(github.event.head_commit.message, '[worldbox-memory-extractor]') || contains(github.event.head_commit.message, '[worldbox-memory-extractor-arm64]') || contains(github.event.head_commit.message, '[worldbox-memory-extractor-running]') }}
        run: |
          archive="$RUNNER_TEMP/Il2CppMetadataExtractor-c31281b.zip"
          curl -fsSL --retry 3 -o "$archive" https://codeload.github.com/CameroonD/Il2CppMetadataExtractor/zip/c31281b43a67a1a7b17a255d930cd3fe8640f489
          echo "56a1350f979f7beebe0e4cbda93b3f4db4c23221565e93bd2b3d6a8e3e8568d0  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/Il2CppMetadataExtractor"
          unzip -q "$archive" -d "$RUNNER_TEMP/Il2CppMetadataExtractor"
          test -f "$RUNNER_TEMP/Il2CppMetadataExtractor/Il2CppMetadataExtractor-c31281b43a67a1a7b17a255d930cd3fe8640f489/dump-metadata.py"
          test -f "$RUNNER_TEMP/Il2CppMetadataExtractor/Il2CppMetadataExtractor-c31281b43a67a1a7b17a255d930cd3fe8640f489/dump-metadata.js"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probe original WorldBox on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          WORLDBOX_RUNTIME_PROBE: '1'
          WORLDBOX_METADATA_SCAN: ${{ (contains(github.event.head_commit.message, '[worldbox-proc-only]') || contains(github.event.head_commit.message, '[worldbox-proc-all]')) && '0' || ((vars.WORLDBOX_RUNTIME_PROBE == '1' || contains(github.event.head_commit.message, '[worldbox-runtime]')) && '1' || '0') }}
          WORLDBOX_MEMORY_METADATA_EXTRACTOR: ${{ (contains(github.event.head_commit.message, '[worldbox-memory-extractor]') || contains(github.event.head_commit.message, '[worldbox-memory-extractor-arm64]') || contains(github.event.head_commit.message, '[worldbox-memory-extractor-running]')) && '1' || '0' }}
          WORLDBOX_MEMORY_METADATA_ATTACH_RUNNING: ${{ contains(github.event.head_commit.message, '[worldbox-memory-extractor-running]') && '1' || '0' }}
          WORLDBOX_PROC_ONLY_SCAN: ${{ (contains(github.event.head_commit.message, '[worldbox-proc-only]') || contains(github.event.head_commit.message, '[worldbox-proc-all]')) && '1' || '0' }}
          WORLDBOX_PROC_ONLY_ALL: ${{ contains(github.event.head_commit.message, '[worldbox-proc-all]') && '1' || '0' }}
          WORLDBOX_EXTRACTOR_SOURCE_DIR: ${{ runner.temp }}/Il2CppMetadataExtractor
          WORLDBOX_EXTRACTOR_ARCHIVE: ${{ runner.temp }}/Il2CppMetadataExtractor-c31281b.zip
          WORLDBOX_FRIDA_SERVER: ${{ runner.temp }}/frida-server
          WORLDBOX_PROC_SCANNER: ${{ runner.temp }}/worldbox-proc-scan
        with:
          api-level: ${{ contains(github.event.head_commit.message, '[worldbox-memory-extractor-arm64]') && '30' || '35' }}
          target: google_apis
          arch: ${{ contains(github.event.head_commit.message, '[worldbox-memory-extractor-arm64]') && 'arm64-v8a' || 'x86_64' }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: PYTHONUNBUFFERED=1 python .github/scripts/inspect_worldbox.py
  rea-android-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python -m pip install requests 'androguard==4.1.3'
      - name: Test DEX callback inventory against synthetic declarations
        run: |
          python tests/test_worldbox_dex_callbacks.py
          python tests/test_worldbox_metadata_java_probe.py
      - name: Install pinned REA and verify JADX engine
        run: |
          npm install --prefix "$RUNNER_TEMP/rea" --ignore-scripts rea-agents@6.8.0
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/jadx.jar" https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar
          echo "6e5eacf500b64292bfb73c49797c1958f6ee44646e43e868039ae7feb573ff75  $RUNNER_TEMP/jadx.jar" | sha256sum -c -
      - name: Inspect WorldBox Android classes with REA
        env:
          WORLDBOX_REA_PROBE: ${{ contains(github.event.head_commit.message, '[worldbox-metadata-java]') && '0' || '1' }}
          WORLDBOX_DEX_CALLBACK_PROBE: ${{ contains(github.event.head_commit.message, '[worldbox-metadata-java]') && '0' || '1' }}
          WORLDBOX_METADATA_JAVA_PROBE: ${{ contains(github.event.head_commit.message, '[worldbox-metadata-java]') && '1' || '0' }}
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          export REA_JADX_MCP_JAR="$RUNNER_TEMP/jadx.jar"
          export WORLDBOX_REA_ENTRY="$RUNNER_TEMP/rea/node_modules/rea-agents/scripts/rea.mjs"
          python .github/scripts/inspect_worldbox.py | tee "$RUNNER_TEMP/worldbox-rea-output.txt"
      - name: Surface metadata Java probe annotations
        if: ${{ contains(github.event.head_commit.message, '[worldbox-metadata-java]') }}
        run: |
          output="$RUNNER_TEMP/worldbox-rea-output.txt"
          test -s "$output"
          if ! grep -qE '::(warning|notice) title=WorldBox metadata Java' "$output"; then
            echo 'No metadata Java probe annotations were produced' >&2
            exit 1
          fi
          grep -E '::(warning|notice) title=WorldBox metadata Java' "$output" || true

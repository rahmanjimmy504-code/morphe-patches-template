name: Inspect WorldBox bundle
on:
  push:
    branches: [arena/abffe0a5-morphe-patches-template]
    paths:
      - .github/workflows/inspect-worldbox.yml
      - .github/scripts/inspect_worldbox.py
      - .github/scripts/worldbox_runtime_scan.py
      - .github/scripts/worldbox_native_scan.py
      - .github/scripts/worldbox_native_flow.py
      - .github/scripts/worldbox_native_xrefs.py
      - .github/scripts/worldbox_ghidra_probe.py
      - .github/scripts/worldbox_ghidra_callees.py
      - .github/scripts/worldbox_upstream.py
      - .github/scripts/worldbox_string_leads.py
      - .github/scripts/worldbox_raw_leads.py
      - .github/scripts/worldbox_raw_context.py
      - .github/scripts/worldbox_asset_leads.py
      - .github/scripts/worldbox_unity_object_leads.py
      - .github/scripts/worldbox_unity_scripts.py
      - .github/scripts/worldbox_unity_script_refs.py
      - .github/scripts/worldbox_bundle_inventory.py
      - .github/scripts/worldbox_guid_script_refs.py
      - .github/scripts/worldbox_unity_schema.py
      - docs/worldbox/WorldboxProbe.java
      - tests/fixtures/worldbox_ghidra_fixture.c
      - tests/test_worldbox_ghidra.py
      - tests/test_worldbox_upstream.py
      - tests/test_worldbox_string_leads.py
      - tests/test_worldbox_raw_leads.py
      - tests/test_worldbox_raw_context.py
      - tests/test_worldbox_asset_leads.py
      - tests/test_worldbox_unity_object_leads.py
      - tests/test_worldbox_unity_scripts.py
      - tests/test_worldbox_unity_script_refs.py
      - tests/test_worldbox_bundle_inventory.py
      - tests/test_worldbox_guid_script_refs.py
      - tests/test_worldbox_unity_schema.py
      - tests/test_worldbox_native.py
      - tests/test_worldbox_native_flow.py
      - tests/test_worldbox_native_xrefs.py
      - docs/worldbox/scan-metadata.js
      - tests/worldbox-metadata-scanner.test.cjs
      - tests/test_worldbox_triage.py
      - docs/worldbox/proc_scan.c
      - tests/test_worldbox_proc_scan.py
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Test synthetic metadata and triage fixtures
        run: |
          node tests/worldbox-metadata-scanner.test.cjs
          python3 tests/test_worldbox_triage.py
          python3 tests/test_worldbox_proc_scan.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '7.0.x'
      - run: python -m pip install requests
      - run: python .github/scripts/inspect_worldbox.py
  # Requires a successful synthetic ARM64 decompilation before processing the game.
  ghidra-arm64-probe:
    if: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JAVA_TOOL_OPTIONS: -Xmx4g
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned tooling and synthetic tests
        run: |
          python -m pip install requests 'pyelftools==0.32' 'capstone==5.0.6'
          python tests/test_worldbox_ghidra.py
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ghidra.zip" https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.4.3_build/ghidra_11.4.3_PUBLIC_20251203.zip
          echo "b22a8baebb14339f19903c54363ba7e01781930cc43ab430539aabce0d58547a  $RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          echo "GHIDRA_HEADLESS=$RUNNER_TEMP/ghidra/ghidra_11.4.3_PUBLIC/support/analyzeHeadless" >> "$GITHUB_ENV"
      - name: Verify decompiler using a synthetic ARM64 fixture
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          fi
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" -O0 -fPIC -fno-inline -fno-optimize-sibling-calls -fno-omit-frame-pointer -funwind-tables -nostdlib -shared -Wl,-Bsymbolic tests/fixtures/worldbox_ghidra_fixture.c -o "$RUNNER_TEMP/worldbox-fixture.so"
          WORLDBOX_TEST_FIXTURE="$RUNNER_TEMP/worldbox-fixture.so" python tests/test_worldbox_ghidra.py
          python .github/scripts/worldbox_ghidra_probe.py --headless "$GHIDRA_HEADLESS" --binary "$RUNNER_TEMP/worldbox-fixture.so" --fixture
      - name: Verify second-argument provenance on the synthetic ARM64 fixture
        if: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-source') }}
        run: python .github/scripts/worldbox_ghidra_probe.py --headless "$GHIDRA_HEADLESS" --binary "$RUNNER_TEMP/worldbox-fixture.so" --fixture --input-source
      - name: Verify input memory-chain provenance on the synthetic ARM64 fixture
        if: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-chain') }}
        run: python .github/scripts/worldbox_ghidra_probe.py --headless "$GHIDRA_HEADLESS" --binary "$RUNNER_TEMP/worldbox-fixture.so" --fixture --input-chain
      - name: Verify callee decompilation on the synthetic ARM64 fixture
        if: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-callee') || contains(github.event.head_commit.message, 'worldbox-ghidra-origin') || contains(github.event.head_commit.message, 'worldbox-ghidra-tail') || contains(github.event.head_commit.message, 'worldbox-ghidra-return') || contains(github.event.head_commit.message, 'worldbox-ghidra-input') || contains(github.event.head_commit.message, 'worldbox-ghidra-children') }}
        run: python .github/scripts/worldbox_ghidra_callees.py --headless "$GHIDRA_HEADLESS" --binary "$RUNNER_TEMP/worldbox-fixture.so" --fixture
      - name: Verify JNI export selection on synthetic ARM64 fixture
        if: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-jni') }}
        run: python .github/scripts/worldbox_ghidra_callees.py --headless "$GHIDRA_HEADLESS" --binary "$RUNNER_TEMP/worldbox-fixture.so" --fixture --jni
      - name: Decompile bounded original ARM64 caller functions
        env:
          WORLDBOX_GHIDRA_JNI_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-jni') && '1' || '0' }}
          WORLDBOX_GHIDRA_CALLEE_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-callee') && '1' || '0' }}
          WORLDBOX_GHIDRA_ORIGIN_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-origin') && '1' || '0' }}
          WORLDBOX_GHIDRA_TAIL_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-tail') && '1' || '0' }}
          WORLDBOX_GHIDRA_RETURN_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-return') && '1' || '0' }}
          WORLDBOX_GHIDRA_INPUT_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-input') && '1' || '0' }}
          WORLDBOX_GHIDRA_CHILDREN_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-children') && '1' || '0' }}
          WORLDBOX_GHIDRA_SOURCE_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-source') && '1' || '0' }}
          WORLDBOX_GHIDRA_CHAIN_PROBE: ${{ contains(github.event.head_commit.message, 'worldbox-ghidra-chain') && '1' || '0' }}
          WORLDBOX_GHIDRA_PROBE: '1'
          PYTHONUNBUFFERED: '1'
        run: python .github/scripts/inspect_worldbox.py
  upstream-arm64-probe:
    if: ${{ contains(github.event.head_commit.message, '[worldbox-upstream]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned analysis libraries
        run: python -m pip install requests 'pyelftools==0.32' 'capstone==5.0.6'
      - name: Test bounded ARM64 caller analysis
        run: |
          python tests/test_worldbox_upstream.py
          python tests/test_worldbox_native_flow.py
          python tests/test_worldbox_native_xrefs.py
      - name: Inspect original ARM64 caller candidates
        env:
          WORLDBOX_UPSTREAM_PROBE: '1'
          WORLDBOX_UPSTREAM_LEVEL2: ${{ contains(github.event.head_commit.message, '[worldbox-upstream-level2]') && '1' || '0' }}
          WORLDBOX_UPSTREAM_LEVEL3: ${{ contains(github.event.head_commit.message, '[worldbox-upstream-level3]') && '1' || '0' }}
          WORLDBOX_UPSTREAM_TAIL_PROBE: ${{ contains(github.event.head_commit.message, '[worldbox-upstream-tail]') && '1' || '0' }}
          WORLDBOX_UPSTREAM_RETURN_PROBE: ${{ contains(github.event.head_commit.message, '[worldbox-upstream-return]') && '1' || '0' }}
          WORLDBOX_UPSTREAM_INPUT_PROBE: ${{ contains(github.event.head_commit.message, '[worldbox-upstream-input]') && '1' || '0' }}
          WORLDBOX_UPSTREAM_CHILDREN_PROBE: ${{ contains(github.event.head_commit.message, '[worldbox-upstream-children]') && '1' || '0' }}
          PYTHONUNBUFFERED: '1'
        run: python .github/scripts/inspect_worldbox.py
  unity-component-schema:
    if: ${{ contains(github.event.head_commit.message, '[worldbox-unity-schema]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install analysis library
        run: python -m pip install requests 'UnityPy==1.25.4'
      - name: Test synthetic component schema inspection
        run: |
          python tests/test_worldbox_unity_scripts.py
          python tests/test_worldbox_unity_script_refs.py
          python tests/test_worldbox_unity_schema.py
      - name: Inspect hash-gated Unity component schemas
        env:
          WORLDBOX_UNITY_SCHEMA: '1'
          PYTHONUNBUFFERED: '1'
        run: python .github/scripts/inspect_worldbox.py
  unity-extensionless-references:
    if: ${{ contains(github.event.head_commit.message, '[worldbox-guid-refs]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install analysis library
        run: python -m pip install requests 'UnityPy==1.25.4'
      - name: Test synthetic serialized pointer detection
        run: |
          python tests/test_worldbox_unity_scripts.py
          python tests/test_worldbox_unity_script_refs.py
          python tests/test_worldbox_bundle_inventory.py
          python tests/test_worldbox_guid_script_refs.py
      - name: Analyze hash-gated serialized files
        env:
          WORLDBOX_GUID_SCRIPT_REFS: '1'
          WORLDBOX_GUID_ALL: ${{ contains(github.event.head_commit.message, '[worldbox-guid-all]') && '1' || '0' }}
          PYTHONUNBUFFERED: '1'
        run: python .github/scripts/inspect_worldbox.py
  unity-bundle-inventory:
    if: ${{ contains(github.event.head_commit.message, '[worldbox-bundle-inventory]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install request library
        run: python -m pip install requests
      - name: Test synthetic APK bundle inventory
        run: python tests/test_worldbox_bundle_inventory.py
      - name: Inventory downloaded APKs for Unity bundles
        env:
          WORLDBOX_BUNDLE_INVENTORY: '1'
          PYTHONUNBUFFERED: '1'
        run: python .github/scripts/inspect_worldbox.py
  unity-script-references-probe:
    if: ${{ contains(github.event.head_commit.message, '[worldbox-unity-refs]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install analysis library
        run: python -m pip install requests 'UnityPy==1.25.4'
      - name: Test synthetic serialized MonoScript and MonoBehaviour references
        run: |
          python tests/test_worldbox_unity_scripts.py
          python tests/test_worldbox_unity_script_refs.py
      - name: Analyze hash-gated Unity script references
        env:
          WORLDBOX_UNITY_SCRIPT_REFS: '1'
          PYTHONUNBUFFERED: '1'
        run: python .github/scripts/inspect_worldbox.py
  unity-premium-scripts-probe:
    if: ${{ contains(github.event.head_commit.message, '[worldbox-unity-scripts]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install analysis library
        run: python -m pip install requests 'UnityPy==1.25.4'
      - name: Verify MonoScript decoding using a synthetic Unity file
        run: python tests/test_worldbox_unity_scripts.py
      - name: Inspect hash-gated original MonoScript identifiers
        env:
          WORLDBOX_UNITY_SCRIPTS: '1'
          PYTHONUNBUFFERED: '1'
        run: python .github/scripts/inspect_worldbox.py
  unity-object-leads-probe:
    if: ${{ contains(github.event.head_commit.message, '[worldbox-unity-objects]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install analysis library
        run: python -m pip install requests 'UnityPy==1.25.4'
      - name: Test synthetic serialized Unity fixture
        run: python tests/test_worldbox_unity_object_leads.py
      - name: Map keyword offsets in hash-gated Unity assets
        env:
          WORLDBOX_UNITY_OBJECT_LEADS: '1'
          PYTHONUNBUFFERED: '1'
        run: python .github/scripts/inspect_worldbox.py
  asset-name-leads-probe:
    if: ${{ contains(github.event.head_commit.message, '[worldbox-asset-leads]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install request library
        run: python -m pip install requests
      - name: Test synthetic APK asset scans
        run: python tests/test_worldbox_asset_leads.py
      - name: Scan original base APK Unity data entries
        env:
          WORLDBOX_ASSET_LEADS: '1'
          PYTHONUNBUFFERED: '1'
        run: python .github/scripts/inspect_worldbox.py
  raw-name-context-probe:
    if: ${{ contains(github.event.head_commit.message, '[worldbox-raw-context]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned analysis libraries
        run: python -m pip install requests 'pyelftools==0.32' 'capstone==5.0.6'
      - name: Test synthetic context and reference probes
        run: |
          python tests/test_worldbox_raw_context.py
          python tests/test_worldbox_string_leads.py
      - name: Inspect hash-gated original ARM64 library
        env:
          WORLDBOX_RAW_CONTEXT: '1'
          PYTHONUNBUFFERED: '1'
        run: python .github/scripts/inspect_worldbox.py
  raw-name-leads-probe:
    if: ${{ contains(github.event.head_commit.message, '[worldbox-raw-leads]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned analysis libraries
        run: python -m pip install requests 'pyelftools==0.32' 'capstone==5.0.6'
      - name: Test synthetic byte searches and ELF mapping
        run: python tests/test_worldbox_raw_leads.py
      - name: Scan original ARM64 libraries
        env:
          WORLDBOX_RAW_LEADS: '1'
          PYTHONUNBUFFERED: '1'
        run: python .github/scripts/inspect_worldbox.py
  string-leads-probe:
    if: ${{ contains(github.event.head_commit.message, '[worldbox-string-leads]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned analysis libraries
        run: python -m pip install requests 'pyelftools==0.32' 'capstone==5.0.6'
      - name: Test synthetic ARM64 string references
        run: |
          python tests/test_worldbox_string_leads.py
          python tests/test_worldbox_native_xrefs.py
      - name: Inspect hash-gated original ARM64 library
        env:
          WORLDBOX_STRING_LEADS: '1'
          PYTHONUNBUFFERED: '1'
        run: python .github/scripts/inspect_worldbox.py
  native-arm64-probe:
    if: ${{ contains(github.event.head_commit.message, '[worldbox-native]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned analysis libraries
        run: python -m pip install requests 'pyelftools==0.32' 'capstone==5.0.6'
      - name: Test synthetic ARM64 ELF fixtures
        run: |
          python tests/test_worldbox_native.py
          python tests/test_worldbox_native_flow.py
          python tests/test_worldbox_native_xrefs.py
      - name: Inspect original ARM64 library without executing it
        env:
          WORLDBOX_NATIVE_PROBE: '1'
          PYTHONUNBUFFERED: '1'
        run: python .github/scripts/inspect_worldbox.py
  runtime-probe:
    if: ${{ vars.WORLDBOX_RUNTIME_PROBE == '1' || contains(github.event.head_commit.message, '[worldbox-runtime]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Install runtime scanner dependencies
        run: |
          python -m pip install 'frida==17.25.0'
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/frida-server.xz" https://github.com/frida/frida/releases/download/17.25.0/frida-server-17.25.0-android-x86_64.xz
          xz -d "$RUNNER_TEMP/frida-server.xz"
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          fi
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang" -std=c11 -Wall -Wextra -Werror -O2 docs/worldbox/proc_scan.c -o "$RUNNER_TEMP/worldbox-proc-scan"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probe original WorldBox on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: PYTHONUNBUFFERED=1 WORLDBOX_RUNTIME_PROBE=1 WORLDBOX_METADATA_SCAN=1 WORLDBOX_FRIDA_SERVER=$RUNNER_TEMP/frida-server WORLDBOX_PROC_SCANNER=$RUNNER_TEMP/worldbox-proc-scan python .github/scripts/inspect_worldbox.py
  rea-android-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python -m pip install requests 'androguard==4.1.3'
      - name: Test DEX callback inventory against synthetic declarations
        run: python tests/test_worldbox_dex_callbacks.py
      - name: Install pinned REA and verify JADX engine
        run: |
          npm install --prefix "$RUNNER_TEMP/rea" --ignore-scripts rea-agents@6.8.0
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/jadx.jar" https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar
          echo "6e5eacf500b64292bfb73c49797c1958f6ee44646e43e868039ae7feb573ff75  $RUNNER_TEMP/jadx.jar" | sha256sum -c -
      - name: Inspect WorldBox Android classes with REA
        env:
          WORLDBOX_REA_PROBE: '1'
          WORLDBOX_DEX_CALLBACK_PROBE: '1'
        run: |
          export REA_JADX_MCP_JAR="$RUNNER_TEMP/jadx.jar"
          export WORLDBOX_REA_ENTRY="$RUNNER_TEMP/rea/node_modules/rea-agents/scripts/rea.mjs"
          python .github/scripts/inspect_worldbox.py
